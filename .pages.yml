# Configuração do painel de edição Pages CMS (https://pagescms.org)
# Com isso, você edita o site por formulários, sem mexer em código.

media:
  input: imagens
  output: imagens

content:
  - name: conteudo
    label: Conteúdo do site
    type: file
    path: conteudo.json
    format: json
    fields:
      - name: comissoes
        label: Status das comissões
        type: object
        fields:
          - { name: abertas, label: "Comissões abertas?", type: boolean }
          - { name: textoAberto, label: Texto quando abertas, type: string }
          - { name: textoFechado, label: Texto quando fechadas, type: string }

      - name: artista
        label: Apresentação (topo do site)
        type: object
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: descricao, label: Frase principal, type: text }
          - { name: detalhe, label: Frase secundária, type: string }
          - { name: imagem, label: Arte de destaque, type: image }
          - { name: imagemDescricao, label: "Descrição da arte (para leitores de tela)", type: string }

      - name: sobre
        label: Sobre (biografia)
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: "Parágrafos da biografia", type: text, list: true }
          - { name: destaques, label: "Destaques (etiquetas curtas)", type: string, list: true }
          - { name: imagem, label: Imagem, type: image }
          - { name: imagemDescricao, label: "Descrição da imagem (para leitores de tela)", type: string }

      - name: galeria
        label: Galeria
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Subtítulo, type: text }
          - name: obras
            label: "Artes (o preço estimado é calculado sozinho pela tabela de preços)"
            type: object
            list: true
            fields:
              - { name: imagem, label: Imagem, type: image }
              - { name: titulo, label: Título, type: string }
              - { name: descricao, label: "Descrição (para leitores de tela)", type: text }
              - name: estilo
                label: "Estilo (igual ao nome na tabela de preços; outro valor = 'sob consulta')"
                type: string
              - name: tamanho
                label: Tamanho
                type: select
                options:
                  values: ["", "Headshot", "Halfbody", "Fullbody"]
              - { name: personagensExtras, label: Personagens extras, type: number }
              - name: background
                label: Background
                type: select
                options:
                  values: ["nenhum", "simples", "complexo"]
              - { name: precoManual, label: "Preço manual (opcional; se preencher, substitui a estimativa. Ex.: R$ 150)", type: string }

      - name: processo
        label: Vídeo do processo
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: video, label: "Vídeo (.mp4)", type: file }

      - name: precos
        label: Preços
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: moeda, label: Moeda, type: string }
          - name: estilos
            label: Estilos
            type: object
            list: true
            fields:
              - { name: nome, label: Nome do estilo, type: string }
              - { name: descricao, label: Descrição, type: text }
              - { name: imagem, label: Imagem da tabela, type: image }
              - name: itens
                label: Tamanhos e preços
                type: object
                list: true
                fields:
                  - { name: tipo, label: "Tamanho (Headshot, Halfbody, Fullbody)", type: string }
                  - { name: preco, label: Preço, type: number }
          - name: extras
            label: "Adicionais (aparecem no quadro 'Adicionais' e entram no preço estimado)"
            type: object
            fields:
              - { name: personagemExtraPorcento, label: "Personagem extra (% a mais)", type: number }
              - { name: backgroundSimples, label: "Background simples (a partir de)", type: number }
              - { name: backgroundComplexo, label: "Background complexo (a partir de)", type: number }

      - name: pedido
        label: Monte seu pedido
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: pagamento, label: "Formas de pagamento (aparece no resumo do pedido)", type: string }
          - { name: maxExtras, label: "Máximo de personagens extras (0 = sem limite)", type: number }

      - name: avisos
        label: Avisos
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - name: lista
            label: Regras
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: texto, label: Texto, type: text }
              - { name: destaque, label: "Destacar em vermelho?", type: boolean }
          - { name: naoFacoTitulo, label: "Título do quadro 'Não faço'", type: string }
          - { name: naoFaco, label: "Não faço (um item por linha)", type: string, list: true }
          - { name: adicionaisTitulo, label: "Título do quadro 'Adicionais' (os valores ficam em Preços → Adicionais)", type: string }

      - name: faq
        label: Perguntas frequentes
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - name: perguntas
            label: Perguntas
            type: object
            list: true
            fields:
              - { name: pergunta, label: Pergunta, type: string }
              - { name: resposta, label: Resposta, type: text }

      - name: contato
        label: Contato
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Subtítulo, type: string }
          - { name: texto, label: Texto, type: text }
          - name: redes
            label: Redes sociais
            type: object
            list: true
            fields:
              - { name: nome, label: "Nome (Telegram, Instagram, TikTok...)", type: string }
              - { name: usuario, label: Usuário, type: string }
              - { name: url, label: Link, type: string }
